name: Game-local standalone launchers and setups
on:
  push:
    branches: [feature/game-local-launchers]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-launch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux launch and baseline tests
        run: |
          python3 -m unittest discover -s steamvr -p direct_launch_test.py
          python3 -m unittest discover -s steamvr -p launch_linux_test.py
          python3 -m unittest discover -s steamvr -p setup_linux_test.py
          python3 -m unittest discover -s steamvr -p plus_integration_test.py
          python3 -m unittest discover -s steamvr -p linux_tls_test.py
          python3 -m unittest discover -s steamvr -p session_test.py
          python3 -m unittest discover -s steamvr -p native_perspectives_test.py
          python3 -m unittest discover -s steamvr -p vr_baseline_test.py
          python3 -m unittest discover -s steamvr -p install_test.py
  windows:
    needs: linux-launch-tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: tools-cache
        with:
          path: deps
          key: pcvr-plus-tools-windows-20260616-4.4.4-3.12.10-v1
      - name: Install upstream pinned Windows tools
        shell: powershell
        run: ./steamvr/setup_windows_tools.ps1
      - uses: actions/cache/save@v4
        if: steps.tools-cache.outputs.cache-hit != 'true'
        with:
          path: deps
          key: pcvr-plus-tools-windows-20260616-4.4.4-3.12.10-v1
      - name: Build Windows plugin and fixtures
        shell: powershell
        run: ./steamvr/build_windows.ps1 -ExperimentalPerspectives
      - name: Run CPU-only Windows fixtures
        shell: powershell
        run: |
          & ./deps/cmake-4.4.4-windows-x86_64/bin/ctest.exe --test-dir build-frame/windows-native --output-on-failure -R '^(flat-controls|math|gameplay|combat-rules|controller-bindings|bow-flight|quick-cast|spell-aim|native-panels|interaction|journal|vr-settings|vr-settings-store|body-calibration|body-tracking)-test$'
          if ($LASTEXITCODE -ne 0) { throw 'C++ fixtures failed' }
      - name: Run Flat/VR launcher fixtures
        shell: powershell
        run: |
          & ./deps/python/python.exe -m unittest discover -s steamvr -p launch_plus_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Plus launcher fixtures failed' }
          & ./deps/python/python.exe -m unittest discover -s steamvr -p launch_windows_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Upstream launcher fixtures failed' }
      - name: Verify shipped VR source baseline
        shell: powershell
        run: |
          & ./deps/python/python.exe -m unittest discover -s steamvr -p vr_baseline_test.py
          if ($LASTEXITCODE -ne 0) { throw 'VR source baseline changed' }
      - name: Run reversible updater fixtures
        shell: powershell
        run: |
          & ./deps/python/python.exe -m unittest discover -s steamvr -p portable_plus_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable updater fixtures failed' }
      - name: Test full installer and Steam shortcuts
        shell: powershell
        run: |
          foreach ($suite in @('direct_launch_test.py', 'setup_native_test.py', 'setup_windows_test.py', 'install_test.py', 'uninstall_windows_test.py', 'plus_setup_test.py', 'plus_integration_test.py', 'battlenet_test.py')) {
            & ./deps/python/python.exe -m unittest discover -s steamvr -p $suite
            if ($LASTEXITCODE -ne 0) { throw "Installer fixtures failed: $suite" }
          }
          & ./deps/python/python.exe -m unittest discover -s installer -p '*_test.py'
          if ($LASTEXITCODE -ne 0) { throw 'Installer staging fixtures failed' }
      - name: Build and smoke-test full Plus installer
        shell: powershell
        run: ./installer/build_plus_release.ps1
      - name: Package portable Windows overlay (no game assets)
        shell: powershell
        run: |
          & ./deps/python/python.exe ./steamvr/package_plus.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
      - name: Test extracted ZIP with its embedded Python
        shell: powershell
        run: |
          & ./deps/python/python.exe ./steamvr/portable_smoke.py ./dist-plus/D2R-PCVR-Plus-Windows.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable ZIP smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: D2R-PCVR-Plus-Windows
          path: |
            dist-plus/D2R-PCVR-Plus-Windows.zip
            dist-plus/D2R-PCVR-Plus-Windows.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: D2R-PCVR-PLUS-Setup-0.1.3
          path: |
            build-frame/installers/D2R-PCVR-PLUS-Setup-0.1.3.exe
            build-frame/installers/D2R-PCVR-PLUS-Setup-0.1.3.exe.sha256
            build-frame/installers/D2R-PCVR-PLUS-Setup-0.1.3.exe.build.json
            PCVR-PLUS-SETUP.md
          if-no-files-found: error

      - name: Package experimental Linux launch test kit
        shell: powershell
        run: |
          & ./deps/python/python.exe steamvr/package_linux_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Linux test kit packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: D2R-PCVR-Plus-Linux-Test
          path: |
            dist-plus/D2R-PCVR-Plus-Linux-Test.tar.gz
            dist-plus/D2R-PCVR-Plus-Linux-Test.tar.gz.sha256
          if-no-files-found: error

  linux-qt-setup:
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: installer/linux-requirements.txt
      - name: Install Qt host libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 xvfb xauth
      - name: Install pinned bundle tools
        run: python -m pip install -r installer/linux-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: D2R-PCVR-Plus-Linux-Test
          path: dist-plus
      - name: Build and smoke-test standalone Qt setup
        run: python installer/build_linux_setup.py --kit dist-plus/D2R-PCVR-Plus-Linux-Test.tar.gz
      - name: Verify dependency HTTPS with embedded Python
        run: build-frame/linux-setup/dist/D2R-PCVR-Plus-Setup/D2R-PCVR-Plus-Setup --tls-check
      - name: Test packaged GUI through X11
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb build-frame/linux-setup/dist/D2R-PCVR-Plus-Setup/D2R-PCVR-Plus-Setup --gui-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: D2R-PCVR-PLUS-Setup-0.2.4-Linux-x86_64
          path: |
            dist-plus/D2R-PCVR-PLUS-Setup-0.2.4-Linux-x86_64.tar.gz
            dist-plus/D2R-PCVR-PLUS-Setup-0.2.4-Linux-x86_64.tar.gz.sha256
            LINUX-SETUP.md
          if-no-files-found: error
